# Railway config-as-code for the Next.js frontend service.
# Built from ./Dockerfile (Next.js standalone, listens on PORT=8080).
#
# NEXT_PUBLIC_* variables and INTERNAL_API_URL (used by rewrites) are baked in at
# build time — set them on the service BEFORE the first build; changing them later
# needs a redeploy.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "public/**", "middleware.ts", "next.config.ts", "package.json", "package-lock.json", "railway.toml", "Dockerfile"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Keep at 1 until token-refresh dedup (src/lib/auth.ts) is multi-instance safe —
# with 2+ replicas parallel refreshes can log users out at random.
numReplicas = 1
