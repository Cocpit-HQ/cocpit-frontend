# Railway config-as-code for the Next.js frontend service.
# Railpack detects Next.js, runs `npm ci` + the build command, and `next start`
# honours the PORT Railway injects.
#
# NEXT_PUBLIC_* variables and INTERNAL_API_URL (used by rewrites) are baked in at
# build time — set them on the service BEFORE the first build; changing them later
# needs a redeploy.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"
watchPatterns = ["src/**", "public/**", "middleware.ts", "next.config.ts", "package.json", "package-lock.json", "railway.toml"]

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Keep at 1 until token-refresh dedup (src/lib/auth.ts) is multi-instance safe —
# with 2+ replicas parallel refreshes can log users out at random.
numReplicas = 1
