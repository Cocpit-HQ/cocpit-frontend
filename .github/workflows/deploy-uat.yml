name: Deploy Frontend to AWS EC2 (UAT)

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    name: Atomic Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Execute Atomic Release on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting atomic frontend release for commit ${{ github.sha }}..."
            /var/www/cocpit/bin/deploy-frontend.sh "${{ github.sha }}"
            
            # Verify health
            sleep 3
            curl -f http://localhost:3000 || exit 1
            echo "✅ Frontend successfully deployed and healthy!"
