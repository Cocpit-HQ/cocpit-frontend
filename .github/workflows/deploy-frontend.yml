name: Deploy Frontend

on:
  push:
    branches:
      - main
      - develop
      - release/*

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        shell: powershell
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            echo "DEST=C:\Users\Administrator\cocpit-frontend-prod" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-frontend-prod" >> $env:GITHUB_ENV
            echo "PORT=3000" >> $env:GITHUB_ENV
          } elseif ("${{ github.ref }}" -like "refs/heads/release/*") {
            echo "DEST=C:\Users\Administrator\Cocpit UAT\cocpit-frontend" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-frontend-uat" >> $env:GITHUB_ENV
            echo "PORT=3002" >> $env:GITHUB_ENV
          } else {
            echo "DEST=C:\Users\Administrator\cocpit-frontend-staging" >> $env:GITHUB_ENV
            echo "PM2_NAME=cocpit-frontend-staging" >> $env:GITHUB_ENV
            echo "PORT=3001" >> $env:GITHUB_ENV
          }

      - name: Sync, Build, and Restart PM2
        shell: powershell
        run: |
          $destPath = "${{ env.DEST }}"
          
          if (!(Test-Path $destPath)) {
              New-Item -ItemType Directory -Path $destPath | Out-Null
          }

          pm2 stop $env:PM2_NAME 2>$null
          
          $ghost = netstat -ano | findstr :$env:PORT
          if ($ghost) {
              $pidToKill = ($ghost -split '\s+')[-1]
              taskkill /F /PID $pidToKill /T 2>$null
          }
          
          Start-Sleep -s 5
          
          cd "$destPath"

          if (Test-Path ".next") {
              Remove-Item -Recurse -Force ".next" -ErrorAction SilentlyContinue
          }
          
          robocopy "$($env:GITHUB_WORKSPACE)" "$destPath" /MIR /XF .env /XD .git node_modules _work .next
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed" }
          
          npm install
          npm run build
          
          $env:PORT = "${{ env.PORT }}"
          
          try {
              pm2 reload $env:PM2_NAME --update-env
              Write-Host "PM2 reload successful"
          }
          catch {
              Write-Host "PM2 process not found. Starting new process..."

              pm2 start node_modules/next/dist/bin/next `
                  --name $env:PM2_NAME `
                  -- start -p $env:PORT
          }
