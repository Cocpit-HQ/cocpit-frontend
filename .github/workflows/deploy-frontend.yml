name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync, Build, and Restart PM2
        shell: powershell
        run: |
          $destPath = "C:\Users\Administrator\cocpit-frontend"
          
          # 1. Stop PM2 AND Force Kill any lingering Node processes on port 3000
          # This is the most reliable way to release EPERM locks on Windows
          pm2 stop cocpit-frontend 2>$null
          $ghost = netstat -ano | findstr :3000
          if ($ghost) {
              Write-Host "Found ghost process on port 3000. Killing it..."
              $pidToKill = ($ghost -split '\s+')[-1]
              taskkill /F /PID $pidToKill /T 2>$null
          }
          
          # 2. Hard pause to let the Windows File System catch up
          Start-Sleep -s 5
          
          # 3. Navigate to destination
          cd "$destPath"

          # 4. MANUALLY delete the .next folder to prevent EPERM during build
          if (Test-Path ".next") {
              Remove-Item -Recurse -Force ".next" -ErrorAction SilentlyContinue
          }
          
          # 5. Sync new source files
          robocopy "$($env:GITHUB_WORKSPACE)" "$destPath" /MIR /XF .env /XD .git node_modules _work .next
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed" }
          
          # 6. Install and Build
          npm install
          npm run build
          
          # 7. Start PM2 using the direct binary path
          pm2 reload cocpit-frontend --update-env
          if ($LASTEXITCODE -ne 0) {
              pm2 start node_modules/next/dist/bin/next --name "cocpit-frontend" -- start
          }