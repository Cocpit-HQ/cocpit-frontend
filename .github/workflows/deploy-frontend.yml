name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync, Build, and Restart PM2
        shell: powershell
        run: |
          # 1. Define destination path
          $destPath = "C:\Users\Administrator\cocpit-frontend"
          
          # 2. Stop PM2 to release folder locks (PowerShell safe way)
          # We use ErrorAction SilentlyContinue to ignore if the process isn't running
          pm2 stop cocpit-frontend 2>$null
          
          # 3. Short pause to ensure Windows file system releases locks
          Start-Sleep -s 5
          
          # 4. Sync files (Protects .env, excludes node_modules and .next)
          # robocopy exit codes 1-3 are actually "Success", so we use || to handle it if needed
          robocopy . "$destPath" /MIR /XF .env /XD .git node_modules _work .next
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with exit code $LASTEXITCODE" }
          
          # 5. Navigate to destination
          cd "$destPath"
          
          # 6. Update dependencies
          npm install
          
          # 7. Build Next.js app
          # This must happen while PM2 is STOPPED to avoid EPERM errors
          npm run build
          
          # 8. Restart PM2 using the direct path to the next binary
          # This avoids the SyntaxError ':' on Windows
          pm2 reload cocpit-frontend --update-env
          if ($LASTEXITCODE -ne 0) {
              pm2 start node_modules/next/dist/bin/next --name "cocpit-frontend" -- start
          }
          
          # 9. Final check: if it fails to be online, throw error
          Start-Sleep -s 2
          pm2 list