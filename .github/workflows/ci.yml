name: Frontend CI & Quality Gate

on:
  pull_request:
    branches:
      - main
      - staging
      - uat
  push:
    branches:
      - main
      - staging
      - uat

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: Production Build Check
        env:
          NEXTAUTH_SECRET: "ci-validation-secret-placeholder-min-32-chars"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "/api"
          NEXT_PUBLIC_BASE_URL: "https://cocpit-backend-staging.up.railway.app"
        run: npm run build

