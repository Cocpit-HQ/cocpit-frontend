name: Frontend CI & Quality Gate
on:
  pull_request:
    branches:
      - main
      - staging
      - uat
  push:
    branches:
      - main
      - staging
      - uat
jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier and ESLint for changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          changed_files="$RUNNER_TEMP/cocpit-changed-files"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' \
            '*.json' '*.css' '*.md' '*.yml' '*.yaml' > "$changed_files"
          mapfile -d '' -t files < "$changed_files"
          if ((${#files[@]})); then
            npx prettier --check -- "${files[@]}"
          fi
          lint_files=()
          for file in "${files[@]}"; do
            case "$file" in
              *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs) lint_files+=("$file") ;;
            esac
          done
          if ((${#lint_files[@]})); then
            npx eslint -- "${lint_files[@]}"
          fi
      - name: Production Build Check
        env:
          NEXTAUTH_SECRET: 'ci-validation-secret-placeholder-min-32-chars'
          NEXTAUTH_URL: 'http://localhost:3000'
          INTERNAL_API_URL: 'http://127.0.0.1:15100/api'
          NEXT_PUBLIC_API_URL: '/api'
          NEXT_PUBLIC_BASE_URL: 'http://127.0.0.1:15100'
        run: npm run build
